<html lang="fr"><style>* { -webkit-text-size-adjust: 109.00000000000001% !important; }</style><head><style>
@font-face {
font-family: "Optimistic";
font-style: normal;
font-weight: 400 600;
font-display: swap;
src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
font-family: "Optimistic Mono";
font-style: normal;
font-weight: 400;
font-display: swap;
src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {

}
:where(code, pre, kbd, samp) {
font-family: "Optimistic Mono", ui-monospace, monospace;
}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visites Stage - Rue Paradis - Temps Reel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#fff}
header{background:#111;color:#fff;padding:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:16px}
#map{height:55vh;width:100%;background:#ddd}
#panel{padding:12px}
button{padding:8px 12px;border-radius:8px;border:none;background:#111;color:#fff;cursor:pointer}
#reserveBtn{background:#0a7a42}
.badge{background:#0a7a42;color:#fff;padding:2px 8px;border-radius:12px;font-size:12px}
</style>
</head>
<body>
<header>
<div><h1>VISITES DE STAGE - RUE PARADIS - TEMPS REEL</h1><span class="badge">● Temps réel activé - 3 élèves Rue Paradis</span></div>
<div><select id="profSelect"><option value="Prof A">Prof A</option><option value="Prof B">Prof B</option></select> <button id="locateBtn">Me localiser</button></div>
</header>
<div id="map"></div>
<div id="panel">
<div><b>TOTAL:</b> <span id="total">3</span> | <b>LIBRES:</b> <span id="libres">3</span> | <b>RESERVES:</b> <span id="reserves">0</span></div>
<h2 id="eleveNom">Clique sur un élève sur la carte</h2>
<p id="eleveAdresse"></p>
<p id="eleveStatut"></p>
<button id="reserveBtn" disabled="">Réserver pour Prof A</button>
<button id="libererBtn" style="display:none">Libérer</button>
<ul id="liste"></ul>
</div>
<script>
// Nettoie l'ancien stockage qui bloquait tout
localStorage.removeItem('eleves-rt');
localStorage.removeItem('eleves-stage');

const eleves = [
{id:'a', nom:'Élève A - Lina', adresse:'12 Rue Paradis, Marseille', lat:43.2895, lng:5.3795, statut:'libre', prof:null},
{id:'b', nom:'Élève B - Mathis', adresse:'25 Rue Paradis, Marseille', lat:43.2902, lng:5.3802, statut:'libre', prof:null},
{id:'c', nom:'Élève C - Inès', adresse:'30 Rue Edmond Rostand, Marseille (à côté Rue Paradis)', lat:43.2915, lng:5.3815, statut:'libre', prof:null},
];

let map = L.map('map').setView([43.2895,5.3795],17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);
let markers={}, myMarker=null, selectedId=null;

function refresh(){
document.getElementById('total').textContent=eleves.length;
document.getElementById('libres').textContent=eleves.filter(e=>e.statut==='libre').length;
document.getElementById('reserves').textContent=eleves.filter(e=>e.statut!=='libre').length;
const ul=document.getElementById('liste'); ul.innerHTML='';
eleves.forEach(e=>{
const li=document.createElement('li');
li.textContent=(e.statut==='libre'?'🟢':'🔴')+' '+e.nom+' - '+e.adresse+' - '+e.statut+(e.prof?' par '+e.prof:'');
li.style.cursor='pointer'; li.onclick=()=>selectEleve(e.id);
ul.appendChild(li);
if(!markers[e.id]){
markers[e.id]=L.marker([e.lat,e.lng]).addTo(map).on('click',()=>selectEleve(e.id));
}
markers[e.id].setPopupContent(`<b>${e.nom}</b><br>${e.adresse}<br><b>${e.statut.toUpperCase()}</b>`);
const col=e.statut==='libre'?'green':'red';
markers[e.id].setIcon(L.divIcon({className:'',html:`<div style="background:${col};width:28px;height:28px;border-radius:50%;border:3px solid white;box-shadow:0 0 6px black;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px">${e.id.toUpperCase()}</div>`}));
});
localStorage.setItem('eleves-stage-final', JSON.stringify(eleves));
}

function selectEleve(id){
selectedId=id;
const e=eleves.find(x=>x.id===id);
map.setView([e.lat,e.lng],18);
markers[id].openPopup();
updatePanel();
}

function updatePanel(){
const e=eleves.find(x=>x.id===selectedId); if(!e) return;
document.getElementById('eleveNom').textContent=e.nom;
document.getElementById('eleveAdresse').textContent=e.adresse;
document.getElementById('eleveStatut').textContent='Statut: '+e.statut.toUpperCase()+(e.prof?' - Bloqué par '+e.prof:' - Libre');
const cur=document.getElementById('profSelect').value;
const rb=document.getElementById('reserveBtn'); const lb=document.getElementById('libererBtn');
if(e.statut==='libre'){ rb.disabled=false; rb.textContent='Réserver pour '+cur+' - Bloquer pour les autres profs'; lb.style.display='none'; }
else{ rb.disabled=true; rb.textContent=e.prof===cur?'Déjà à toi':'Déjà bloqué par '+e.prof; lb.style.display=e.prof===cur?'inline-block':'none'; }
}

document.getElementById('reserveBtn').onclick=()=>{
const e=eleves.find(x=>x.id===selectedId); const cur=document.getElementById('profSelect').value;
if(e.statut!=='libre'){ alert('Trop tard ! '+e.prof+' l a déjà bloqué. C est la règle du premier arrivé.'); return; }
e.statut='reserve'; e.prof=cur; refresh(); updatePanel();
// Pour le temps réel multi-appareils, on sauvegarde et on notifie
if(navigator.vibrate) navigator.vibrate(100);
};

document.getElementById('libererBtn').onclick=()=>{
const e=eleves.find(x=>x.id===selectedId); e.statut='libre'; e.prof=null; refresh(); updatePanel();
};

document.getElementById('profSelect').onchange=()=>updatePanel();

document.getElementById('locateBtn').onclick=()=>{
document.getElementById('eleveStatut').textContent='Demande de localisation... clique sur Autoriser';
navigator.geolocation.watchPosition(pos=>{
const {latitude,longitude}=pos.coords;
document.getElementById('eleveStatut').textContent=`Tu es à ${latitude.toFixed(5)}, ${longitude.toFixed(5)} - On calcule le plus proche`;
if(!myMarker){
myMarker=L.marker([latitude,longitude],{icon:L.divIcon({className:'',html:'<div style="background:#2a5bd7;width:24px;height:24px;border-radius:50%;border:3px solid white;box-shadow:0 0 8px blue"></div>'})}).addTo(map).bindPopup('Toi - Temps réel').openPopup();
} else myMarker.setLatLng([latitude,longitude]);
map.setView([latitude,longitude],17);
}, err=>{ alert('Active la localisation: '+err.message+' - Va dans le cadenas à gauche de la barre d adresse > Localisation > Autoriser'); }, {enableHighAccuracy:true});
};

refresh();
// Force la carte à se redessiner après 1 seconde (corrige le bug de carte grise)
setTimeout(()=>{ map.invalidateSize(); }, 500);
setTimeout(()=>{ map.invalidateSize(); }, 1500);
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script>

</body></html>
